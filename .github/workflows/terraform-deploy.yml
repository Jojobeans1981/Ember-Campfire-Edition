name: Terraform Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/terraform-deploy.yml'
  workflow_dispatch:
    inputs:
      backend_image_tag:
        description: 'Optional ECR image tag to deploy (7-char commit SHA tag).'
        required: false
        type: string
      backend_desired_count:
        description: 'Optional ECS desired count override (defaults to 1).'
        required: false
        type: string
  workflow_run:
    workflows:
      - Backend Image
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  TFC_ORGANIZATION: DNSG4
  TFC_WORKSPACE: ember-infra
  AWS_REGION: us-east-2
  ECR_REPOSITORY: ember-backend

jobs:
  terraform-cloud-run:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.GH_AWS_DEPLOYER_ROLE }}

      - name: Package Terraform configuration
        run: tar -C infra -czf infra.tar.gz .

      - name: Create Terraform Cloud run
        env:
          TF_API_KEY: ${{ secrets.TF_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_BACKEND_IMAGE_TAG: ${{ github.event.inputs.backend_image_tag }}
          DISPATCH_BACKEND_DESIRED_COUNT: ${{ github.event.inputs.backend_desired_count }}
        run: |
          set -euo pipefail

          speculative=false
          auto_apply=true
          dispatch_desired_count="${DISPATCH_BACKEND_DESIRED_COUNT:-}"

          if [ -z "$dispatch_desired_count" ] || [ "$dispatch_desired_count" = "null" ]; then
            desired_count="1"
          else
            desired_count="$dispatch_desired_count"
          fi

          if ! [[ "$desired_count" =~ ^[0-9]+$ ]]; then
            echo "backend_desired_count must be a non-negative integer, got '$desired_count'." >&2
            exit 1
          fi

          resolve_latest_sha_tag() {
            local latest_tag
            latest_tag=$(aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --output json | jq -r '[.imageDetails | sort_by(.imagePushedAt) | reverse[] | (.imageTags // [])[] | select(test("^[0-9a-f]{7}$"))][0] // empty')

            if [ -z "$latest_tag" ]; then
              echo "Unable to resolve a SHA image tag from ECR repository '$ECR_REPOSITORY'." >&2
              exit 1
            fi

            printf '%s' "$latest_tag"
          }

          image_tag_exists() {
            local candidate_tag="$1"
            aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag="$candidate_tag" >/dev/null 2>&1
          }

          resolve_image_tag() {
            local candidates=()
            local workflow_tag=""
            local latest_sha_tag

            if [ "$EVENT_NAME" = "workflow_run" ]; then
              if [ -z "${WORKFLOW_RUN_HEAD_SHA:-}" ]; then
                echo "workflow_run.head_sha is required when triggered by Backend Image workflow." >&2
                exit 1
              fi

              workflow_tag="${WORKFLOW_RUN_HEAD_SHA::7}"
              candidates+=("$workflow_tag")
            fi

            if [ -n "${DISPATCH_BACKEND_IMAGE_TAG:-}" ] && [ "${DISPATCH_BACKEND_IMAGE_TAG}" != "null" ]; then
              candidates+=("$DISPATCH_BACKEND_IMAGE_TAG")
            fi

            latest_sha_tag=$(resolve_latest_sha_tag)
            candidates+=("$latest_sha_tag")

            for candidate in "${candidates[@]}"; do
              if image_tag_exists "$candidate"; then
                printf '%s' "$candidate"
                return 0
              fi
            done

            echo "No valid ECR image tag found from candidates: ${candidates[*]}" >&2
            exit 1
          }

          image_tag=$(resolve_image_tag)

          workspace_response=$(curl -sS \
            --header "Authorization: Bearer $TF_API_KEY" \
            --header "Content-Type: application/vnd.api+json" \
            "https://app.terraform.io/api/v2/organizations/$TFC_ORGANIZATION/workspaces/$TFC_WORKSPACE")

          workspace_id=$(printf '%s' "$workspace_response" | jq -r '.data.id')
          if [ -z "$workspace_id" ] || [ "$workspace_id" = "null" ]; then
            echo "Unable to resolve Terraform Cloud workspace '$TFC_ORGANIZATION/$TFC_WORKSPACE'." >&2
            exit 1
          fi

          vars_response=$(curl -sS \
            --header "Authorization: Bearer $TF_API_KEY" \
            --header "Content-Type: application/vnd.api+json" \
            "https://app.terraform.io/api/v2/workspaces/$workspace_id/vars")

          backend_var_id=$(printf '%s' "$vars_response" | jq -r '[.data[] | select((.attributes.category == "terraform" and .attributes.key == "backend_image_tag") or (.attributes.category == "env" and .attributes.key == "TF_VAR_backend_image_tag"))][0].id // empty')
          backend_var_category=$(printf '%s' "$vars_response" | jq -r '[.data[] | select((.attributes.category == "terraform" and .attributes.key == "backend_image_tag") or (.attributes.category == "env" and .attributes.key == "TF_VAR_backend_image_tag"))][0].attributes.category // empty')

          if [ -n "$backend_var_id" ]; then
            if [ "$backend_var_category" = "env" ]; then
              backend_var_payload=$(jq -n \
                --arg key "TF_VAR_backend_image_tag" \
                --arg value "$image_tag" \
                '{data:{type:"vars",attributes:{key:$key,value:$value,category:"env",sensitive:false}}}')
            else
              backend_var_payload=$(jq -n \
                --arg key "backend_image_tag" \
                --arg value "$image_tag" \
                '{data:{type:"vars",attributes:{key:$key,value:$value,category:"terraform",hcl:false,sensitive:false}}}')
            fi

            curl -sS \
              --request PATCH \
              --header "Authorization: Bearer $TF_API_KEY" \
              --header "Content-Type: application/vnd.api+json" \
              --data "$backend_var_payload" \
              "https://app.terraform.io/api/v2/vars/$backend_var_id" >/dev/null
          else
            backend_var_payload=$(jq -n \
              --arg key "backend_image_tag" \
              --arg value "$image_tag" \
              --arg workspace_id "$workspace_id" \
              '{data:{type:"vars",attributes:{key:$key,value:$value,category:"terraform",hcl:false,sensitive:false},relationships:{workspace:{data:{type:"workspaces",id:$workspace_id}}}}}')

            curl -sS \
              --request POST \
              --header "Authorization: Bearer $TF_API_KEY" \
              --header "Content-Type: application/vnd.api+json" \
              --data "$backend_var_payload" \
              "https://app.terraform.io/api/v2/vars" >/dev/null
          fi

          desired_count_var_id=$(printf '%s' "$vars_response" | jq -r '[.data[] | select((.attributes.category == "terraform" and .attributes.key == "backend_desired_count") or (.attributes.category == "env" and .attributes.key == "TF_VAR_backend_desired_count"))][0].id // empty')
          desired_count_var_category=$(printf '%s' "$vars_response" | jq -r '[.data[] | select((.attributes.category == "terraform" and .attributes.key == "backend_desired_count") or (.attributes.category == "env" and .attributes.key == "TF_VAR_backend_desired_count"))][0].attributes.category // empty')

          if [ -n "$desired_count_var_id" ]; then
            if [ "$desired_count_var_category" = "env" ]; then
              desired_count_var_payload=$(jq -n \
                --arg key "TF_VAR_backend_desired_count" \
                --arg value "$desired_count" \
                '{data:{type:"vars",attributes:{key:$key,value:$value,category:"env",sensitive:false}}}')
            else
              desired_count_var_payload=$(jq -n \
                --arg key "backend_desired_count" \
                --arg value "$desired_count" \
                '{data:{type:"vars",attributes:{key:$key,value:$value,category:"terraform",hcl:false,sensitive:false}}}')
            fi

            curl -sS \
              --request PATCH \
              --header "Authorization: Bearer $TF_API_KEY" \
              --header "Content-Type: application/vnd.api+json" \
              --data "$desired_count_var_payload" \
              "https://app.terraform.io/api/v2/vars/$desired_count_var_id" >/dev/null
          else
            desired_count_var_payload=$(jq -n \
              --arg key "backend_desired_count" \
              --arg value "$desired_count" \
              --arg workspace_id "$workspace_id" \
              '{data:{type:"vars",attributes:{key:$key,value:$value,category:"terraform",hcl:false,sensitive:false},relationships:{workspace:{data:{type:"workspaces",id:$workspace_id}}}}}')

            curl -sS \
              --request POST \
              --header "Authorization: Bearer $TF_API_KEY" \
              --header "Content-Type: application/vnd.api+json" \
              --data "$desired_count_var_payload" \
              "https://app.terraform.io/api/v2/vars" >/dev/null
          fi

          configuration_payload=$(jq -n '{data:{type:"configuration-versions",attributes:{"auto-queue-runs":false}}}')

          configuration_response=$(curl -sS \
            --request POST \
            --header "Authorization: Bearer $TF_API_KEY" \
            --header "Content-Type: application/vnd.api+json" \
            --data "$configuration_payload" \
            "https://app.terraform.io/api/v2/workspaces/$workspace_id/configuration-versions")

          upload_url=$(printf '%s' "$configuration_response" | jq -r '.data.attributes."upload-url"')
          configuration_version_id=$(printf '%s' "$configuration_response" | jq -r '.data.id')

          if [ -z "$upload_url" ] || [ "$upload_url" = "null" ]; then
            echo "Terraform Cloud did not return an upload URL for the configuration version." >&2
            exit 1
          fi

          curl -sS --request PUT --header "Content-Type: application/octet-stream" --data-binary @infra.tar.gz "$upload_url" >/dev/null

          run_payload=$(jq -n \
            --arg message "GitHub Actions run for $GITHUB_SHA" \
            --arg workspace_id "$workspace_id" \
            --arg configuration_version_id "$configuration_version_id" \
            --argjson speculative "$speculative" \
            --argjson auto_apply "$auto_apply" \
            '{
              data: {
                type: "runs",
                attributes: {
                  message: $message,
                  "is-destroy": false,
                  auto_apply: $auto_apply,
                  speculative: $speculative
                },
                relationships: {
                  workspace: {
                    data: {
                      type: "workspaces",
                      id: $workspace_id
                    }
                  },
                  "configuration-version": {
                    data: {
                      type: "configuration-versions",
                      id: $configuration_version_id
                    }
                  }
                }
              }
            }')

          run_response=$(curl -sS \
            --request POST \
            --header "Authorization: Bearer $TF_API_KEY" \
            --header "Content-Type: application/vnd.api+json" \
            --data "$run_payload" \
            "https://app.terraform.io/api/v2/runs")

          run_id=$(printf '%s' "$run_response" | jq -r '.data.id')
          run_url=$(printf 'https://app.terraform.io/app/%s/workspaces/%s/runs/%s' "$TFC_ORGANIZATION" "$TFC_WORKSPACE" "$run_id")

          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "Failed to create Terraform Cloud run." >&2
            echo "$run_response" >&2
            exit 1
          fi

          {
            echo "Queued Terraform Cloud run: $run_url"
            echo "Using backend_image_tag=$image_tag"
            echo "Using backend_desired_count=$desired_count"
          } >> "$GITHUB_STEP_SUMMARY"
