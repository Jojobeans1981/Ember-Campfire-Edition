name: Frontend Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-2
  APP_DOMAIN: app.readwithember.com
  APP_BUCKET: app.readwithember.com
  APP_REDIRECT_URI: https://app.readwithember.com/auth/callback
  APP_LOGOUT_URI: https://app.readwithember.com/
  PROJECT_NAME: ember
  DEPLOY_ENV: production
  TFC_ORGANIZATION: DNSG4
  TFC_WORKSPACE: ember-infra

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.GH_AWS_DEPLOYER_ROLE }}

      - name: Verify frontend bucket exists
        run: |
          set -euo pipefail
          if ! aws s3api head-bucket --bucket "$APP_BUCKET" >/dev/null 2>&1; then
            echo "Expected frontend bucket '$APP_BUCKET' does not exist yet. Apply Terraform infrastructure first." >&2
            exit 1
          fi

      - name: Resolve CloudFront distribution
        id: distribution
        run: |
          set -euo pipefail
          distribution_id=$(aws cloudfront list-distributions --query "DistributionList.Items[?contains(Aliases.Items, '$APP_DOMAIN')].Id | [0]" --output text)
          if [ "$distribution_id" = "None" ] || [ -z "$distribution_id" ]; then
            echo "CloudFront distribution for '$APP_DOMAIN' does not exist yet. Apply Terraform infrastructure first." >&2
            exit 1
          fi
          echo "distribution_id=$distribution_id" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Resolve Cognito build configuration
        id: cognito
        env:
          TF_API_KEY: ${{ secrets.TF_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${TF_API_KEY:-}" ]; then
            echo "TF_API_KEY is not configured. Cannot read canonical Cognito outputs from Terraform Cloud." >&2
            exit 1
          fi

          workspace_response=$(curl -sS \
            --header "Authorization: Bearer $TF_API_KEY" \
            --header "Content-Type: application/vnd.api+json" \
            "https://app.terraform.io/api/v2/organizations/$TFC_ORGANIZATION/workspaces/$TFC_WORKSPACE")

          workspace_id=$(printf '%s' "$workspace_response" | jq -r '.data.id')
          if [ -z "$workspace_id" ] || [ "$workspace_id" = "null" ]; then
            echo "Unable to resolve Terraform Cloud workspace '$TFC_ORGANIZATION/$TFC_WORKSPACE'." >&2
            exit 1
          fi

          outputs_response=""
          max_attempts=6
          attempt=1
          while [ "$attempt" -le "$max_attempts" ]; do
            response_body=$(mktemp)
            http_status=$(curl -sS \
              --write-out "%{http_code}" \
              --output "$response_body" \
              --header "Authorization: Bearer $TF_API_KEY" \
              --header "Content-Type: application/vnd.api+json" \
              "https://app.terraform.io/api/v2/workspaces/$workspace_id/current-state-version-outputs")

            if [ "$http_status" = "200" ]; then
              outputs_response=$(cat "$response_body")
              rm -f "$response_body"
              break
            fi

            if [ "$http_status" = "503" ]; then
              if [ "$attempt" -lt "$max_attempts" ]; then
                echo "Terraform Cloud outputs are still processing (attempt $attempt/$max_attempts). Retrying in 10s..."
                rm -f "$response_body"
                attempt=$((attempt + 1))
                sleep 10
                continue
              fi

              echo "Failed while reading Terraform Cloud outputs for workspace '$TFC_ORGANIZATION/$TFC_WORKSPACE': outputs are still processing after $max_attempts attempts." >&2
              echo "Terraform Cloud response body:" >&2
              cat "$response_body" >&2
              rm -f "$response_body"
              exit 1
            fi

            echo "Failed while reading Terraform Cloud outputs for workspace '$TFC_ORGANIZATION/$TFC_WORKSPACE' (HTTP $http_status)." >&2
            echo "Terraform Cloud response body:" >&2
            cat "$response_body" >&2
            rm -f "$response_body"
            exit 1
          done

          if [ -z "$outputs_response" ]; then
            echo "Failed while reading Terraform Cloud outputs for workspace '$TFC_ORGANIZATION/$TFC_WORKSPACE': empty outputs response." >&2
            exit 1
          fi

          user_pool_id=$(printf '%s' "$outputs_response" | jq -r '.data[] | select(.attributes.name == "cognito_user_pool_id") | .attributes.value' | head -n 1)
          client_id=$(printf '%s' "$outputs_response" | jq -r '.data[] | select(.attributes.name == "cognito_user_pool_client_id") | .attributes.value' | head -n 1)
          domain_host=$(printf '%s' "$outputs_response" | jq -r '.data[] | select(.attributes.name == "cognito_hosted_ui_domain") | .attributes.value' | head -n 1)

          if [ -z "$user_pool_id" ] || [ "$user_pool_id" = "null" ]; then
            echo "Terraform Cloud output 'cognito_user_pool_id' is missing for workspace '$TFC_ORGANIZATION/$TFC_WORKSPACE'." >&2
            exit 1
          fi

          if [ -z "$client_id" ] || [ "$client_id" = "null" ]; then
            echo "Terraform Cloud output 'cognito_user_pool_client_id' is missing for workspace '$TFC_ORGANIZATION/$TFC_WORKSPACE'." >&2
            exit 1
          fi

          if [ -z "$domain_host" ] || [ "$domain_host" = "null" ]; then
            echo "Terraform Cloud output 'cognito_hosted_ui_domain' is missing for workspace '$TFC_ORGANIZATION/$TFC_WORKSPACE'." >&2
            exit 1
          fi

          echo "user_pool_id=$user_pool_id" >> "$GITHUB_OUTPUT"
          echo "client_id=$client_id" >> "$GITHUB_OUTPUT"
          echo "domain=$domain_host" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        env:
          VITE_API_BASE_URL: /api
          VITE_COGNITO_REGION: ${{ env.AWS_REGION }}
          VITE_COGNITO_USER_POOL_ID: ${{ steps.cognito.outputs.user_pool_id }}
          VITE_COGNITO_USER_POOL_CLIENT_ID: ${{ steps.cognito.outputs.client_id }}
          VITE_COGNITO_DOMAIN: ${{ steps.cognito.outputs.domain }}
          VITE_COGNITO_REDIRECT_URI: ${{ env.APP_REDIRECT_URI }}
          VITE_COGNITO_LOGOUT_URI: ${{ env.APP_LOGOUT_URI }}
        run: npm run build

      - name: Upload static assets
        run: aws s3 sync dist/ "s3://$APP_BUCKET" --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.distribution.outputs.distribution_id }}" \
            --paths '/*'
